<!DOCTYPE html>
<html>

<head>

<title>User Details - Tagvee</title>

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">
 <link rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='images/tagvee-favicon.png') }}">
<link
rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<header class="navbar">

<div class="container nav-content">

            <a href="/" class="logo-link">
                <img
                    src="{{ url_for('static', filename='images/tagvee-logo-final.png') }}"
                    alt="TAGVEE"
                    class="logo-image"              >
            </a>


<a href="/admin-dashboard"
class="btn btn-secondary">

Dashboard

</a>

</div>

</header>


<section class="auth-container">

<div class="auth-card">

<h1>User Details</h1>

<p>

Complete information about the registered user.

</p>

<br>

<label>Full Name</label>

<input
type="text"
value="{{ user.name }}"
readonly>

<label>Email Address</label>

<input
type="text"
value="{{ user.email }}"
readonly>

<label>Phone Number</label>

<input
type="text"
value="{{ user.phone }}"
readonly>

<label>Vehicle Number</label>

<input
type="text"
value="{{ user.vehicle_number }}"
readonly>

<label>Vehicle Type</label>

<input
type="text"
value="{{ user.vehicle_type }}"
readonly>

<br>

<a href="/admin-dashboard">

<button
class="btn btn-primary auth-btn">

Back to Dashboard

</button>

</a>

</div>

</section>

</body>

</html>
