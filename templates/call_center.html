<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>TAGVEE Call Center</title>

    <style>

        body {

            font-family: Arial, sans-serif;

            background: #f5f7fb;

            text-align: center;

            padding: 40px 20px;

        }


        .call-box {

            max-width: 420px;

            margin: auto;

            background: white;

            padding: 30px;

            border-radius: 16px;

            box-shadow:
                0 5px 25px
                rgba(0,0,0,0.08);

        }


        .status {

            margin: 20px 0;

            font-size: 18px;

        }


        button {

            border: none;

            padding: 14px 25px;

            margin: 8px;

            border-radius: 10px;

            font-size: 16px;

            cursor: pointer;

        }


        .accept {

            background: #198754;

            color: white;

        }


        .reject {

            background: #dc3545;

            color: white;

        }


        .end {

            background: #333;

            color: white;

        }


        #remoteAudio {

            width: 100%;

            margin-top: 15px;

        }

     .icon{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.2em;flex:0 0 auto}.brand-heading{display:flex;align-items:center;justify-content:center;gap:10px}button{display:inline-flex;align-items:center;justify-content:center;gap:9px}
    </style>

</head>


<body>

<div class="call-box">

    <h1 class="brand-heading"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 3 5.2 2 2 0 0 1 5 3h3a2 2 0 0 1 2 1.7l.4 3.1a2 2 0 0 1-.6 1.7L8 9.9a16 16 0 0 0 6 6l1.4-1.8a2 2 0 0 1 1.7-.6l3.1.4a2 2 0 0 1 1.8 2z"/></svg> TAGVEE</h1>

    <h2>Vehicle Owner Call Center</h2>


    <div
        id="status"
        class="status">

        Waiting for incoming call...

    </div>


    <div
        id="buttons"
        style="display:none;">

        <button
            class="accept"
            onclick="acceptCall()">

            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m5 12 4 4L19 6"/></svg> Accept Call

        </button>


        <button
            class="reject"
            onclick="rejectCall()">

            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"/></svg> Reject

        </button>

    </div>


    <button
        id="endButton"
        class="end"
        onclick="endCall()"
        style="display:none;">

        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10.7 13.3a16 16 0 0 0 3 2.7l1.3-1.3a2 2 0 0 1 1.7-.6l3.1.5a2 2 0 0 1 1.7 2v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 10 18.5M6.2 14.8A19.7 19.7 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7l.4 3.1a2 2 0 0 1-.6 1.7L7.6 9.8"/><path d="m2 2 20 20"/></svg> End Call

    </button>


    <audio
        id="remoteAudio"
        autoplay>
    </audio>

</div>


<script>
let currentCallId = null;
let peerConnection = null;
let localStream = null;
let pendingPollTimer = null;
let answerSent = false;

const statusElement = document.getElementById("status");
const buttons = document.getElementById("buttons");
const endButton = document.getElementById("endButton");
const remoteAudio = document.getElementById("remoteAudio");
const turnUsername = {{ turn_username|tojson }};
const turnCredential = {{ turn_credential|tojson }};
const iceServers = [
    { urls: "stun:stun.relay.metered.ca:80" }
];
if (turnUsername && turnCredential) {
    iceServers.push(
        {
            urls: "turn:global.relay.metered.ca:80",
            username: turnUsername,
            credential: turnCredential
        },
        {
            urls: "turn:global.relay.metered.ca:80?transport=tcp",
            username: turnUsername,
            credential: turnCredential
        },
        {
            urls: "turn:global.relay.metered.ca:443",
            username: turnUsername,
            credential: turnCredential
        },
        {
            urls: "turns:global.relay.metered.ca:443?transport=tcp",
            username: turnUsername,
            credential: turnCredential
        }
    );
}
const rtcConfiguration = { iceServers };

async function waitForIceGatheringComplete(timeoutMs = 10000) {
    if (!peerConnection || peerConnection.iceGatheringState === "complete") return;
    await new Promise(resolve => {
        let done = false;
        const finish = () => {
            if (done) return;
            done = true;
            clearTimeout(timeout);
            peerConnection?.removeEventListener("icegatheringstatechange", check);
            resolve();
        };
        const check = () => {
            if (peerConnection?.iceGatheringState === "complete") finish();
        };
        const timeout = setTimeout(finish, timeoutMs);
        peerConnection.addEventListener("icegatheringstatechange", check);
        check();
    });
}

async function checkForCall() {
    if (currentCallId) return;
    try {
        const response = await fetch("/api/owner/pending-call", { cache: "no-store" });
        if (!response.ok) return;
        const data = await response.json();
        if (data.call_id) {
            currentCallId = data.call_id;
            answerSent = false;
            statusElement.innerText = "Incoming vehicle assistance call";
            buttons.style.display = "block";
        }
    } catch (error) {
        console.error("TAGVEE pending-call error:", error);
    }
}
setInterval(checkForCall, 750);
checkForCall();

async function acceptCall() {
    if (!currentCallId || peerConnection) return;
    const acceptedId = currentCallId;
    buttons.style.display = "none";
    statusElement.innerText = "Requesting microphone...";

    try {
        peerConnection = new RTCPeerConnection(rtcConfiguration);
        peerConnection.onicecandidate = event => {
            if (event.candidate) {
                console.log("TAGVEE owner ICE candidate:", event.candidate.candidate);
            }
        };
        peerConnection.ontrack = event => {
            remoteAudio.srcObject = event.streams[0];
            remoteAudio.play().catch(() => {});
        };
        peerConnection.onconnectionstatechange = () => {
            const s = peerConnection?.connectionState;
            console.log("TAGVEE owner state:", {
                connection: s,
                ice: peerConnection?.iceConnectionState,
                gathering: peerConnection?.iceGatheringState,
                signaling: peerConnection?.signalingState
            });
            if (s === "connected") {
                statusElement.innerText = "Secure voice call connected";
                endButton.style.display = "inline-block";
            } else if (s === "failed") {
                statusElement.innerText = "Secure connection failed";
            } else if (s === "disconnected") {
                statusElement.innerText = "Connection interrupted";
            }
        };

        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        statusElement.innerText = "Receiving secure call offer...";
        const response = await fetch(`/api/call/${acceptedId}`, { cache: "no-store" });
        const callData = await response.json();
        if (!response.ok || !callData.offer) throw new Error(callData.error || "Call offer unavailable");

        await peerConnection.setRemoteDescription(new RTCSessionDescription(callData.offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        statusElement.innerText = "Finalizing secure connection...";
        await waitForIceGatheringComplete();

        const answerResponse = await fetch(`/api/call/${acceptedId}/answer`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ answer: peerConnection.localDescription })
        });
        const answerData = await answerResponse.json();
        console.log("TAGVEE answer POST:", answerResponse.status, answerData);
        if (!answerResponse.ok || !answerData.success) {
            throw new Error(answerData.error || `Answer rejected (${answerResponse.status})`);
        }
        answerSent = true;
        statusElement.innerText = "Connecting secure audio...";
    } catch (error) {
        console.error("TAGVEE accept error:", error);
        try { await fetch(`/api/call/${acceptedId}/end`, { method: "POST" }); } catch (_) {}
        cleanupCall();
        statusElement.innerText = "Could not connect the call.";
    }
}

async function rejectCall() {
    const id = currentCallId;
    if (!id) return;
    try { await fetch(`/api/call/${id}/reject`, { method: "POST" }); } catch (_) {}
    cleanupCall();
    statusElement.innerText = "Call rejected.";
}

async function endCall() {
    const id = currentCallId;
    if (id) {
        try { await fetch(`/api/call/${id}/end`, { method: "POST" }); } catch (_) {}
    }
    cleanupCall();
    statusElement.innerText = "Call ended.";
}

function cleanupCall() {
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    localStream = null;
    if (peerConnection) peerConnection.close();
    peerConnection = null;
    currentCallId = null;
    answerSent = false;
    buttons.style.display = "none";
    endButton.style.display = "none";
    remoteAudio.srcObject = null;
}

window.addEventListener("pagehide", () => {
    if (currentCallId && navigator.sendBeacon) {
        navigator.sendBeacon(`/api/call/${currentCallId}/end`, new Blob([], { type: "application/json" }));
    }
});
</script>

</body>

</html>
