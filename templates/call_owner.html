<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Calling Owner - TAGVEE</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            text-align: center;
            padding: 50px 20px;
        }

        .call-box {
            max-width: 420px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        button {
            border: none;
            padding: 14px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        .end {
            background: #dc3545;
            color: white;
        }

        .back {
            display: block;
            margin-top: 25px;
            text-decoration: none;
            color: #333;
        }

        #remoteAudio {
            display: none;
        }

    </style>

</head>


<body data-owner-id="{{ user.id }}">

<div class="call-box">

    <h1>📞</h1>

    <h2>Calling Vehicle Owner</h2>

    <p id="status">
        Preparing secure voice connection...
    </p>

    <button
        id="endButton"
        class="end"
        onclick="endCall()"
        style="display:none;">

        🔴 End Call

    </button>

    <a
        href="/user/{{ user.id }}"
        class="back">

        ← Back to Vehicle Assistance

    </a>

    <audio
        id="remoteAudio"
        autoplay>
    </audio>

</div>


<script>

const ownerId =
    Number(document.body.dataset.ownerId);


let callId = null;
let callerToken = null;
let candidateBuffer = [];

let peerConnection = null;

let localStream = null;

let candidatePollTimer = null;

let answerPollTimer = null;

let sentCallerCandidates = new Set();

let receivedOwnerCandidates = new Set();


const statusElement =
    document.getElementById("status");


const endButton =
    document.getElementById("endButton");


const remoteAudio =
    document.getElementById("remoteAudio");


const turnUsername = {{ turn_username|tojson }};
const turnCredential = {{ turn_credential|tojson }};
const iceServers = [
    { urls: "stun:stun.relay.metered.ca:80" }
];
if (turnUsername && turnCredential) {
    iceServers.push(
        {
            urls: "turn:global.relay.metered.ca:80",
            username: turnUsername,
            credential: turnCredential
        },
        {
            urls: "turn:global.relay.metered.ca:80?transport=tcp",
            username: turnUsername,
            credential: turnCredential
        },
        {
            urls: "turn:global.relay.metered.ca:443",
            username: turnUsername,
            credential: turnCredential
        },
        {
            urls: "turns:global.relay.metered.ca:443?transport=tcp",
            username: turnUsername,
            credential: turnCredential
        }
    );
}
const rtcConfiguration = { iceServers };


/* =========================
   START CALL
========================= */

async function startCall() {

    try {

        statusElement.innerText =
            "🎤 Requesting microphone...";


        localStream =
            await navigator.mediaDevices.getUserMedia({

                audio: true,

                video: false

            });


        peerConnection =
            new RTCPeerConnection(
                rtcConfiguration
            );

        peerConnection.oniceconnectionstatechange = function() {
            console.log("TAGVEE caller ICE:", peerConnection.iceConnectionState);
        };

        peerConnection.onconnectionstatechange = function() {
            console.log("TAGVEE caller connection:", peerConnection.connectionState);
        };


        localStream
            .getTracks()
            .forEach(track => {

                peerConnection.addTrack(
                    track,
                    localStream
                );

            });


        peerConnection.ontrack =
            function(event) {

                remoteAudio.srcObject =
                    event.streams[0];

            };


        peerConnection.onicecandidate =
            async function(event) {

                if (!event.candidate) {
                    return;
                }


                const candidate =
                    event.candidate.toJSON();

                // The ICE event can fire before the Flask call ID exists.
                // Keep that candidate and send it after /start returns.
                if (!callId) {
                    candidateBuffer.push(candidate);
                    return;
                }


                try {
                    await sendCallerCandidate(candidate);
                } catch (error) {
                    console.error("Caller ICE send error:", error);
                }

            };


        peerConnection.onconnectionstatechange =
            function() {

                const state =
                    peerConnection.connectionState;


                console.log(
                    "Caller connection state:",
                    state
                );


                if (state === "connected") {

                    statusElement.innerText =
                        "🟢 Secure voice call connected";

                    endButton.style.display =
                        "inline-block";

                }


                if (state === "connecting") {

                    statusElement.innerText =
                        "🔄 Connecting secure audio...";

                }


                if (state === "disconnected") {

                    statusElement.innerText =
                        "⚠️ Connection interrupted";

                }


                if (state === "failed") {

                    statusElement.innerText =
                        "❌ Secure connection failed";

                }


                if (state === "closed") {

                    statusElement.innerText =
                        "Call ended.";

                }

            };


        const offer =
            await peerConnection.createOffer();


        await peerConnection.setLocalDescription(
            offer
        );


        statusElement.innerText =
            "📞 Contacting vehicle owner...";


        const response =
            await fetch(
                `/api/call/start/${ownerId}`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        offer:
                            peerConnection.localDescription

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.error ||
                "Unable to start call"
            );

        }


        callId =
            data.call_id;

        callerToken =
            data.caller_token;

        if (!callerToken) {
            throw new Error("Call authorization token was not returned.");
        }

        // Flush ICE candidates generated before callId was available.
        for (const candidate of candidateBuffer) {
            await sendCallerCandidate(candidate);
        }
        candidateBuffer = [];

        statusElement.innerText =
            "📞 Calling vehicle owner...";


        startAnswerPolling();

        startOwnerCandidatePolling();


    } catch (error) {

        console.error(
            "Call start error:",
            error
        );


        statusElement.innerText =
            "❌ Unable to start voice call.";


        cleanupLocalCall();

    }

}


/* =========================
   WAIT FOR ANSWER
========================= */

function startAnswerPolling() {

    candidateBuffer = [];

    if (answerPollTimer) {

        clearInterval(
            answerPollTimer
        );

    }


    answerPollTimer =
        setInterval(async () => {

            if (
                !callId ||
                !peerConnection
            ) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `/api/call/${callId}`,
                        {
                            headers: {
                                "X-Call-Token": callerToken
                            }
                        }
                    );


                if (!response.ok) {
                    return;
                }


                const data =
                    await response.json();


                if (
                    data.status === "rejected"
                ) {

                    clearInterval(
                        answerPollTimer
                    );

                    answerPollTimer =
                        null;

                    statusElement.innerText =
                        "❌ Call rejected.";

                    cleanupLocalCall();

                    return;

                }


                if (
                    data.status === "ended"
                ) {

                    clearInterval(
                        answerPollTimer
                    );

                    answerPollTimer =
                        null;

                    statusElement.innerText =
                        "Call ended.";

                    cleanupLocalCall();

                    return;

                }


                if (
                    data.answer &&
                    peerConnection.signalingState ===
                        "have-local-offer"
                ) {

                    clearInterval(
                        answerPollTimer
                    );

                    answerPollTimer =
                        null;


                    await peerConnection.setRemoteDescription(
                        new RTCSessionDescription(
                            data.answer
                        )
                    );


                    statusElement.innerText =
                        "🔄 Connecting secure audio...";

                }

            } catch (error) {

                console.error(
                    "Answer polling error:",
                    error
                );

            }

        }, 1000);

}


async function sendCallerCandidate(candidate) {

    if (!callId || !callerToken) {
        return;
    }

    const candidateKey = JSON.stringify(candidate);

    if (sentCallerCandidates.has(candidateKey)) {
        return;
    }

    sentCallerCandidates.add(candidateKey);

    const response = await fetch(
        `/api/call/${callId}/candidate/caller`,
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-Call-Token": callerToken
            },
            body: JSON.stringify({ candidate })
        }
    );

    if (!response.ok) {
        console.error("Caller ICE send failed:", response.status);
    }
}


/* =========================
   OWNER ICE CANDIDATES
========================= */

function startOwnerCandidatePolling() {

    if (candidatePollTimer) {

        clearTimeout(
            candidatePollTimer
        );

    }


    async function poll() {

        if (
            !callId ||
            !peerConnection
        ) {
            return;
        }


        try {

            const response =
                await fetch(
                    `/api/call/${callId}`
                );


            if (!response.ok) {
                return;
            }


            const data =
                await response.json();


            if (data.owner_candidates) {

                for (
                    const candidate
                    of data.owner_candidates
                ) {

                    const candidateKey =
                        JSON.stringify(candidate);


                    if (
                        receivedOwnerCandidates.has(
                            candidateKey
                        )
                    ) {
                        continue;
                    }


                    receivedOwnerCandidates.add(
                        candidateKey
                    );


                    try {

                        await peerConnection.addIceCandidate(
                            new RTCIceCandidate(
                                candidate
                            )
                        );

                    } catch (error) {

                        console.error(
                            "Owner ICE error:",
                            error
                        );

                    }

                }

            }


            if (
                data.status !== "ended" &&
                data.status !== "rejected"
            ) {

                candidatePollTimer =
                    setTimeout(
                        poll,
                        1000
                    );

            }

        } catch (error) {

            console.error(
                "Owner candidate polling error:",
                error
            );


            candidatePollTimer =
                setTimeout(
                    poll,
                    1500
                );

        }

    }


    poll();

}


/* =========================
   END CALL
========================= */

async function endCall() {

    const activeCallId =
        callId;


    cleanupLocalCall();


    if (activeCallId) {

        try {

            await fetch(
                `/api/call/${activeCallId}/end`,
                {
                    method: "POST",
                    headers: {
                        "X-Call-Token": callerToken
                    }
                }
            );

        } catch (error) {

            console.error(
                "End call error:",
                error
            );

        }

    }


    statusElement.innerText =
        "Call ended.";

}


/* =========================
   LOCAL CLEANUP
========================= */

function cleanupLocalCall() {

    if (answerPollTimer) {

        clearInterval(
            answerPollTimer
        );

        answerPollTimer =
            null;

    }


    if (candidatePollTimer) {

        clearTimeout(
            candidatePollTimer
        );

        candidatePollTimer =
            null;

    }


    if (localStream) {

        localStream
            .getTracks()
            .forEach(track => track.stop());

        localStream =
            null;

    }


    if (peerConnection) {

        peerConnection.close();

        peerConnection =
            null;

    }


    remoteAudio.srcObject =
        null;


    endButton.style.display =
        "none";

}


startCall();

</script>

</body>

</html>
