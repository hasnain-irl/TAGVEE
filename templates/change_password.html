<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Change Password - Tagvee</title>
    <link rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='images/tagvee-favicon.png') }}">

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body>

<header class="navbar">

    <div class="container nav-content">

            <a href="/" class="logo-link">
                <img
                    src="{{ url_for('static', filename='images/tagvee-logo-final.png') }}"
                    alt="TAGVEE"
                    class="logo-image"              >
            </a>


        <a href="/dashboard">
            <button class="btn btn-outline">
                Dashboard
            </button>
        </a>

    </div>

</header>

<div class="container">

    <div class="auth-container">

        <div class="auth-card">

            <h1>Change Password</h1>

            <p>
                Keep your account secure by
                updating your password regularly.
            </p>

            <form method="POST">

                <label>Current Password</label>

                <input
                    type="password"
                    name="old_password"
                    placeholder="Enter current password"
                    required
                >

                <label>New Password</label>

                <input
                    type="password"
                    name="new_password"
                    placeholder="Enter new password"
                    required
                >

                <button
                    type="submit"
                    class="btn btn-primary auth-btn">

                    Update Password

                </button>

            </form>

            <div class="auth-footer">

                <a href="/dashboard">
                    Back to Dashboard
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
