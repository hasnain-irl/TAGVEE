<!DOCTYPE html>
<html>
<head>
    <title>Emergency Services - Tagvee</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='images/tagvee-favicon.png') }}">
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>
<body>

<header class="navbar">
    <div class="container nav-content">

            <a href="/" class="logo-link">
                <img
                    src="{{ url_for('static', filename='images/tagvee-logo-final.png') }}"
                    alt="TAGVEE"
                    class="logo-image"              >
            </a>


    </div>
</header>

<section class="auth-container">

    <div class="auth-card">

        <h1>Emergency Services</h1>

        <p>
            Quickly access emergency services during critical situations.
        </p>

        <br>

        <a href="tel:15" class="btn btn-primary auth-btn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 18v-6a5 5 0 0 1 10 0v6M5 18h14M3 22h18M12 2v2M4.2 5.2l1.4 1.4m14.2-1.4-1.4 1.4"/></svg> Call Police (15)</a>

        <br><br>

        <a href="tel:1122" class="btn btn-primary auth-btn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10 10H6l-3 4v5h3m8 0h4V9h-8v10M3 14h7m-3-3v6m11-2h2l2 2v3h-4"/><circle cx="8" cy="19" r="2"/><circle cx="17" cy="19" r="2"/></svg> Call Ambulance (1122)</a>

        <br><br>

        <a href="tel:16" class="btn btn-danger auth-btn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8.5 14.5A5.5 5.5 0 0 0 12 22a6 6 0 0 0 6-6c0-3-2-5-4-8-.5 3-2 4-2 4-1-3-3-5-3-8-3 3-5 7-5 11a8 8 0 0 0 8 7"/></svg> Call Fire Brigade (16)</a>

    </div>

</section>

</body>
</html>
